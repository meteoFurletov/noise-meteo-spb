[project]
name = "noise-meteo-spb"
version = "0.1.0"
description = "Climatology of meteorological propagation conditions for traffic noise calculation in Saint Petersburg"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Nikita Furletov", email = "meteofurletov@gmail.com" },
]
keywords = [
    "traffic-noise",
    "sound-propagation",
    "iso-9613-2",
    "cnossos-eu",
    "era5",
    "reanalysis",
    "atmospheric-stability",
    "urban-climatology",
    "saint-petersburg",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    # Core scientific stack
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    # Atmospheric data handling
    "xarray>=2024.1",
    "netcdf4>=1.6",
    "zarr>=2.16",
    # ERA5 access — pick one or both depending on access pattern
    "cdsapi>=0.7",       # for direct CDS API queries
    "gcsfs>=2024.2",     # for ARCO-ERA5 / WeatherBench-X via Google Cloud Storage
    # Stability and atmospheric science helpers
    "metpy>=1.6",        # provides solar zenith, dewpoint→RH, atmospheric utilities
    # Geospatial
    "pyproj>=3.6",       # coordinate transformations
    "shapely>=2.0",      # minimal case-study geometry
    "geopandas>=0.14",   # for downstream GIS work; minimal use here
    # Visualization
    "matplotlib>=3.8",
    "cartopy>=0.22",     # for the SPb-domain maps in step 5
    "contextily>=1.7.0", # basemap tiles for the case-study maps
    # CLI and config
    "typer>=0.9",
    "pyyaml>=6.0",
    # Logging
    "structlog>=24.1",
    # Thesis document generation
    "python-docx>=1.1",
    "markdown-it-py>=3",
    "latex2mathml>=3.77",
    "mathml2omml>=0.0.2",
]

[project.urls]
Repository = "https://github.com/meteoFurletov/noise-meteo-spb"
Issues = "https://github.com/meteoFurletov/noise-meteo-spb/issues"

[project.scripts]
noise-meteo = "src.run:app"

# `uv sync` installs the `dev` group by default. Jupyter is opt-in:
#   uv sync --group notebooks
[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]
notebooks = [
    "ipykernel>=6.28",
    "jupyterlab>=4.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Notebooks are exploratory scratch space and are not linted.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Default rule set (pyflakes + pycodestyle errors). Lambda assignment is used
# deliberately for small local helpers in the step runners.
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short"
