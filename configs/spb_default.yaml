# noise-meteo-spb default configuration
# Saint Petersburg metropolitan area, 2014–2024.
#
# Every numerical parameter that affects the science lives here. Code reads
# this file via src/config.py; do not hardcode values in modules.

# ──── Spatial domain ──────────────────────────────────────────────────────
domain:
  name: "spb_metro"
  lat_min: 59.5
  lat_max: 60.5
  lon_min: 29.5
  lon_max: 31.0
  # ERA5 native resolution is 0.25°. SPb domain at 0.25° is roughly 4×6=24 cells.
  # ERA5-Land at 0.1° gives ~60 cells. For the first iteration we use ERA5.

# ──── Time window ─────────────────────────────────────────────────────────
time:
  start: "2014-01-01T00:00:00"
  end:   "2024-12-31T23:00:00"
  timezone_local: "Europe/Moscow"   # UTC+3 year-round, no DST in Russia
  # ~96,000 hourly samples per cell. Storage is small enough at this domain
  # to keep everything in memory comfortably.

# ──── ERA5 variables ──────────────────────────────────────────────────────
era5:
  source: "arco"   # one of: "arco" (Google Cloud Zarr), "cds" (CDS API)
  single_levels:
    - "10m_u_component_of_wind"      # 10u
    - "10m_v_component_of_wind"      # 10v
    - "2m_temperature"                # 2t
    - "2m_dewpoint_temperature"       # 2d
    - "surface_pressure"              # sp
    - "total_cloud_cover"             # tcc
    - "boundary_layer_height"         # blh
    - "total_precipitation"           # tp
  pressure_levels:
    # Used only for the upper-wind reference in Richardson computation.
    # ERA5 has 1000, 975, 950, 925, 900 hPa available; 925 hPa is ~750 m AGL,
    # 1000 hPa is ~110 m AGL at standard surface pressure. We use 1000 hPa
    # as the closest approximation to a "100 m" reference; this is one of
    # the methodological choices flagged for sensitivity analysis.
    - 1000
  pressure_level_variables:
    - "u_component_of_wind"
    - "v_component_of_wind"
    - "temperature"

# ──── ERA5 v2 CDS cache ──────────────────────────────────────────────────
# Expanded variable set for bulk Richardson at fixed 100 m AGL,
# Monin-Obukhov 1/L, Turner-variant Pasquill, and diagnostics.
era5_v2:
  time:
    start: "2014-01-01"
    end:   "2024-12-31"
  area:
    # CDS order: [North, West, South, East]
    bbox: [60.5, 29.5, 59.5, 31.0]
  datasets:
    single_levels:
      dataset_name: "reanalysis-era5-single-levels"
      variables:
        # Baseline (group "basic")
        - "10m_u_component_of_wind"
        - "10m_v_component_of_wind"
        - "2m_temperature"
        - "2m_dewpoint_temperature"
        - "surface_pressure"
        - "total_cloud_cover"
        - "boundary_layer_height"
        - "total_precipitation"
        # For improved Ri (group "ri_upper")
        - "100m_u_component_of_wind"
        - "100m_v_component_of_wind"
        - "skin_temperature"
        # For Monin-Obukhov 1/L (group "mo")
        # Source: ECMWF Confluence "ERA5: How to calculate Obukhov Length"
        # NOTE: instantaneous variants, NOT the accumulated sshf/slhf
        - "instantaneous_surface_sensible_heat_flux"
        - "instantaneous_moisture_flux"
        - "instantaneous_eastward_turbulent_surface_stress"
        - "instantaneous_northward_turbulent_surface_stress"
        - "friction_velocity"          # zust, verification-only
        # For Turner-variant Pasquill (group "pasquill_turner")
        - "surface_solar_radiation_downwards"
        - "total_sky_direct_solar_radiation_at_surface"   # fdir, direct-beam SW
        # Diagnostics (group "diagnostics")
        - "minimum_2m_temperature_since_previous_post_processing"
        - "maximum_2m_temperature_since_previous_post_processing"
    pressure_levels:
      dataset_name: "reanalysis-era5-pressure-levels"
      pressure_levels: ["1000", "975", "950"]
      variables:
        - "u_component_of_wind"
        - "v_component_of_wind"
        - "temperature"
        - "geopotential"
    static:
      dataset_name: "reanalysis-era5-single-levels"
      # Fetched at a single date/time; same field every hour
      reference_datetime: "2024-01-01T00:00:00"
      variables:
        - "geopotential"                              # orography
        - "standard_deviation_of_filtered_subgrid_orography"
    single_levels_timeseries:
      dataset_name: "reanalysis-era5-single-levels-timeseries"
      # Point time-series ARCO product; much faster for the variables it covers.
      variables:
        - "10m_u_component_of_wind"
        - "10m_v_component_of_wind"
        - "2m_temperature"
        - "2m_dewpoint_temperature"
        - "surface_pressure"
        - "total_cloud_cover"
        - "boundary_layer_height"
        - "total_precipitation"
        - "100m_u_component_of_wind"
        - "100m_v_component_of_wind"
        - "skin_temperature"
        - "surface_solar_radiation_downwards"
  request:
    # CDS API request-size strategy
    batch_strategy: "per_year"        # one request per (year, dataset)
    format: "netcdf"
    max_variables_per_request: 1     # fallback after CDS cost-limit rejection
    max_concurrent_requests: 5       # keep several small CDS jobs in flight
    timeseries_max_concurrent_requests: 1
    timeseries_retry_sleep_seconds: 300
    timeseries_max_attempts: 48
    cds_retry_attempts: 6
    cds_retry_sleep_seconds: 180
    polite_sleep_seconds: 2.0         # between successful submissions
    max_queue_wait_hours: 6           # log and skip if queue exceeds this
  cache:
    raw_dir:      "data/raw/era5_v2"
    interim_zarr: "data/interim/era5_spb_v2.zarr"

# ──── Sector binning ──────────────────────────────────────────────────────
sectors:
  count: 18
  width_deg: 20
  # Convention: sector k spans [(k-0.5)*20°, (k+0.5)*20°), centered at k*20°.
  # Sector 0 is centered on north (0°) and represents propagation toward N,
  # i.e., wind component toward N (= negative v) is favorable for sector 0.

# ──── Seasonal binning ────────────────────────────────────────────────────
seasons:
  DJF: [12, 1, 2]
  MAM: [3, 4, 5]
  JJA: [6, 7, 8]
  SON: [9, 10, 11]

# ──── Lden time-of-day periods ────────────────────────────────────────────
# Hours are local time (timezone_local above).
periods:
  day:
    start_hour: 7
    end_hour: 19    # exclusive: 07:00 ≤ h < 19:00
  evening:
    start_hour: 19
    end_hour: 23
  night:
    start_hour: 23
    end_hour: 7     # wraps midnight: h ≥ 23 OR h < 7

# ──── Stability classification (v2) ───────────────────────────────────────
# Step 2 v2 module: src/stability/runner.py
# Output:           data/interim/stability_v2.zarr
# Input:            data/interim/era5_spb_v2.zarr
stability:
  pipeline_version: v2
  input_zarr:  "data/interim/era5_spb_v2.zarr"
  output_zarr: "data/interim/stability_v2.zarr"

  Ri_b:
    z_lower_m: 2          # temperature reference (uses 10 m wind, small approximation)
    z_upper_m: 100        # AGL
    threshold: 0.1
    # min_shear_sq is the wind-shear-squared floor below which Ri_b is NaN.
    # The Step 2 v2 spec suggested 0.01 m²/s² (≡ 0.1 m/s shear over 90 m of
    # height — below the ERA5 wind-field noise floor); applying that value
    # to the SPb v2 cache produced p1=-22, p99=+23 tails (§9.2 wants ±5).
    # Raised to 1.0 m²/s² (≡ ~1 m/s shear over the layer) to discard
    # weak-wind regimes where bulk Ri is mathematically defined but
    # physically meaningless. Empirically tightens the p1/p99 tails
    # into the §9.2 ±5 band without distorting the median.
    # Documented in docs/step2_v2_report.md §4.
    min_shear_sq: 1.0

  monin_obukhov:
    threshold_inv_L: 0.05 # m⁻¹
    min_ustar: 0.05       # m/s
    kappa: 0.4
    cp: 1004.7
    Lv: 2.501e6
    Rd: 287.05

  pasquill_turner:
    insolation_W_per_m2:
      moderate: 350
      strong: 700
    nighttime_cloud_threshold: 0.5
    daytime_fdir_threshold_W_per_m2: 10
    wind_bins_m_per_s: [2, 3, 5, 6]
    transitional_resolution: more_unstable

  t100_interpolation:
    pressure_levels_hPa: [1000, 975, 950]
    dry_adiabatic_lapse_K_per_m: 0.00977

# Legacy v1 stability config (kept for reference; v1 code is archived under
# src/stability/_v1_archive and not invoked by the v2 runner).
stability_v1:
  primary: "richardson"
  cross_check: "pasquill"
  richardson:
    upper_pressure_level_hpa: 1000
    gravity_ms2: 9.81
    upper_height_agl_m: 110.0
    lower_temperature_height_agl_m: 2.0
    classes:
      - {name: "A", ri_max: -0.86}
      - {name: "B", ri_max: -0.37}
      - {name: "C", ri_max: -0.10}
      - {name: "D", ri_max:  0.10}
      - {name: "E", ri_max:  0.20}
      - {name: "F", ri_max:  0.40}
      - {name: "G", ri_max:  999.0}
  pasquill:
    solar_zenith_day_threshold_deg: 85.0
    strong_insolation_zenith_max_deg: 60.0
    moderate_insolation_zenith_max_deg: 75.0
    day_cloud_downgrade_fraction: 0.50
    day_overcast_fraction: 0.875
    night_cloudy_fraction: 0.50
    very_calm_wind_ms: 1.0
    wind_speed_bins_ms: [2.0, 3.0, 5.0, 6.0]

# ──── Favorable propagation criterion ─────────────────────────────────────
# Per ISO 9613-2 / ГОСТ 31295.2 logic. A sector-hour is favorable if EITHER:
#   (a) wind component along sector ≥ wind_threshold_ms, OR
#   (b) atmospheric stability is in stable_classes.
favorable:
  pipeline_version: v2
  wind_threshold_m_per_s: 2.0
  n_sectors: 18
  sector_convention: iso_9613_2_to     # azimuth = direction noise propagates TO
  thermal_primary: Ri_with_PG_cascade  # Ri_b >= 0.1 with PG cascade on NaN
  thermal_variants_for_sensitivity:
    - Ri_strict          # no cascade
    - L_strict           # inv_L >= 0.05
    - L_moderate         # inv_L >= 0.01
    - PG                 # Pasquill E + F + G
  L_moderate_threshold_inv_m: 0.01

# Legacy v1 favorable config (kept for reference; v1 module is archived under
# src/favorable/_v1_archive and not invoked by the v2 runner).
favorable_v1:
  wind_threshold_ms: 2.0   # CNOSSOS practice; sweep [1, 2, 3] for sensitivity
  stable_classes: ["E", "F", "G"]   # slightly to extremely stable

# ──── Propagation case-study model ────────────────────────────────────────
propagation:
  delta_l_model: "distance_dependent_nmpb"
  delta_l_A_db: 3.0
  delta_l_B_db: 6.0
  delta_l_d0_m: 50.0
  delta_l_max_db: 15.0

# ──── Radiosonde validation ───────────────────────────────────────────────
soundings:
  station:
    coord_lat: 59.952
    coord_lon: 30.707
    ids_known: [26063, 26075]
  time:
    start: "2014-01-01"
    end: "2024-12-31"
    sample_strategy: "all"

# ──── Aggregation (Step 4 v2) ────────────────────────────────────────────
aggregate:
  pipeline_version: v2
  seasons: [DJF, MAM, JJA, SON]
  periods:
    day:     [7, 19]    # local hour [start, end)
    evening: [19, 23]
    night:   [23, 7]    # wraps midnight
  local_timezone_offset_hours: 3
  output_format: netcdf4
  output_compression_level: 4
  cf_conventions: "CF-1.10"
  input_zarr:  "data/interim/favorable_v2.zarr"
  output_nc:   "data/processed/p_favorable_spb.nc"

# ──── Output ──────────────────────────────────────────────────────────────
output:
  processed_path: "data/processed/p_favorable_spb.nc"
  # Variables written: p_favorable (float32), n_samples (int32)
  # Dimensions: cell (~50), sector (18), season (4), period (3)
  # Total size: under 100 KB.

  metadata:
    title: "Climatology of favorable propagation conditions, Saint Petersburg, 2014-2024"
    institution: "RGGMU"
    references: "Hersbach et al. 2020; ISO 9613-2:2024; GOST 31295.2-2005"
    conventions: "CF-1.10"

# ──── Validation against ground stations ──────────────────────────────────
validation:
  stations:
    pulkovo:    {lat: 59.79, lon: 30.27, wmo_id: "26063"}
    voeykovo:   {lat: 59.95, lon: 30.71, wmo_id: "26069"}
    kronstadt:  {lat: 59.99, lon: 29.78, wmo_id: "26060"}
  # Validation is optional and currently exploratory — see notebooks/.
